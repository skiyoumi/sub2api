<svg class="qq-penguin-icon" viewBox="3 1 58 62" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <style>
    .qq-penguin-body {
      transform-origin: 32px 54px;
      animation: qq-waddle 3.2s ease-in-out infinite;
    }
    .qq-penguin-wing-left {
      transform-origin: 18px 28px;
      animation: qq-wave-left 3.2s ease-in-out infinite;
    }
    .qq-penguin-wing-right {
      transform-origin: 46px 28px;
      animation: qq-wave-right 3.2s ease-in-out infinite;
    }
    .qq-penguin-scarf-tail {
      transform-origin: 45px 35px;
      animation: qq-scarf 3.2s ease-in-out infinite;
    }
    .qq-penguin-eye {
      transform-origin: 32px 18.4px;
      animation: qq-blink 4.8s ease-in-out infinite;
    }
    @keyframes qq-waddle {
      0%, 45%, 100% { transform: translateY(0) rotate(0); }
      12% { transform: translateY(-3px) rotate(-4deg); }
      24% { transform: translateY(-4px) rotate(4deg); }
      36% { transform: translateY(-2px) rotate(-2deg); }
    }
    @keyframes qq-wave-left {
      0%, 45%, 100% { transform: rotate(0); }
      12%, 30% { transform: rotate(16deg); }
      21%, 39% { transform: rotate(5deg); }
    }
    @keyframes qq-wave-right {
      0%, 45%, 100% { transform: rotate(0); }
      12%, 30% { transform: rotate(-16deg); }
      21%, 39% { transform: rotate(-5deg); }
    }
    @keyframes qq-scarf {
      0%, 45%, 100% { transform: rotate(0); }
      12% { transform: rotate(-8deg); }
      24% { transform: rotate(8deg); }
      36% { transform: rotate(-4deg); }
    }
    @keyframes qq-blink {
      0%, 46%, 50%, 100% { transform: scaleY(1); }
      48% { transform: scaleY(0.12); }
    }
    @media (prefers-reduced-motion: reduce) {
      .qq-penguin-body,
      .qq-penguin-wing,
      .qq-penguin-scarf-tail,
      .qq-penguin-eye { animation: none; }
    }
  </style>
  <g class="qq-penguin-body">
    <path class="qq-penguin-wing qq-penguin-wing-left" d="M17.5 25.5C10.2 27.2 6.8 35.8 9.3 43.6c1.5 4.7 4.8 7.5 9.4 8.2l4.1-15.2-5.3-11.1Z" fill="#050505" stroke="#F8FAFC" stroke-width="1.25" stroke-linejoin="round"/>
    <path class="qq-penguin-wing qq-penguin-wing-right" d="M46.5 25.5c7.3 1.7 10.7 10.3 8.2 18.1-1.5 4.7-4.8 7.5-9.4 8.2l-4.1-15.2 5.3-11.1Z" fill="#050505" stroke="#F8FAFC" stroke-width="1.25" stroke-linejoin="round"/>
    <ellipse cx="32" cy="29.5" rx="18.5" ry="25.5" fill="#050505" stroke="#F8FAFC" stroke-width="1.35"/>
    <ellipse cx="32" cy="39" rx="12.8" ry="15.3" fill="#FFFFFF"/>
    <ellipse class="qq-penguin-eye" cx="25.7" cy="18.4" rx="7.25" ry="9.15" fill="#FFFFFF"/>
    <ellipse class="qq-penguin-eye" cx="38.3" cy="18.4" rx="7.25" ry="9.15" fill="#FFFFFF"/>
    <ellipse class="qq-penguin-eye" cx="27" cy="19.2" rx="2.35" ry="3.25" fill="#050505"/>
    <ellipse class="qq-penguin-eye" cx="37" cy="19.2" rx="2.35" ry="3.25" fill="#050505"/>
    <circle class="qq-penguin-eye" cx="27.7" cy="18.1" r="0.65" fill="#FFFFFF"/>
    <circle class="qq-penguin-eye" cx="37.7" cy="18.1" r="0.65" fill="#FFFFFF"/>
    <path d="m25.8 25.3 6.2-3.6 6.2 3.6-6.2 4.4-6.2-4.4Z" fill="#F6B500"/>
    <path d="M14.8 30.7c10.7 3.4 23.7 3.4 34.4 0l1.8 5.1c-11.8 4-26.2 4-38 0l1.8-5.1Z" fill="#E7252D"/>
    <path class="qq-penguin-scarf-tail" d="m44.7 34.4 9.1 3.4-4.7 14-8.1-5.1 3.7-12.3Z" fill="#E7252D"/>
    <path class="qq-penguin-foot qq-penguin-foot-left" d="M18.1 51.5c4.2-2.3 9.7-1.4 11.9 2.4-3.3 5.8-12.2 7.2-18.7 3.4-.3-2.6 2.2-4.7 6.8-5.8Z" fill="#F6B500"/>
    <path class="qq-penguin-foot qq-penguin-foot-right" d="M45.9 51.5c-4.2-2.3-9.7-1.4-11.9 2.4 3.3 5.8 12.2 7.2 18.7 3.4.3-2.6-2.2-4.7-6.8-5.8Z" fill="#F6B500"/>
  </g>
</svg>
